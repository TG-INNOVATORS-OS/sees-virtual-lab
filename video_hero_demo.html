<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Locked Video Hero Showcase</title>
  <style>
    :root {
      --bg: #05070d;
      --text: #f2f4f8;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: var(--sans); }

    #hero-container {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      touch-action: none;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform-origin: center center;
      will-change: transform;
      transition: opacity 0.6s ease;
      touch-action: none;
      pointer-events: none;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,7,13,0.4) 0%, rgba(5,7,13,0) 30%, rgba(5,7,13,0.2) 70%, rgba(5,7,13,0.7) 100%);
      pointer-events: none;
    }

    .nav-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-pill:hover { background: rgba(56, 189, 248, 0.2); }

    .center-text-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6%;
      text-align: center;
      pointer-events: none;
    }

    #hero-title {
      font-weight: 900;
      font-size: clamp(34px, 7.5vw, 96px);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);
      text-shadow: 0 6px 36px rgba(0,0,0,0.6);
      will-change: transform, filter, opacity;
      display: inline-block;
    }

    #hero-tagline {
      font-weight: 700;
      font-size: clamp(20px, 3.5vw, 42px);
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--text);
      text-shadow: 0 4px 28px rgba(0,0,0,0.6);
      opacity: 0;
    }

    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: clamp(24px, 6vh, 48px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(240,244,248,0.75);
      font-size: clamp(10px, 1.4vw, 12px);
      font-weight: 700;
      letter-spacing: 0.3em;
      transition: opacity 0.4s ease;
      pointer-events: none;
      text-transform: uppercase;
    }

    @keyframes metro-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(6px); opacity: 1; }
    }
    .bounce-arrow { animation: metro-bounce 1.6s ease-in-out infinite; }

    .progress-bar-track {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: rgba(255,255,255,0.12);
    }
    #progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #34d399);
      transform: scaleX(0);
      transform-origin: left center;
    }

    .signature-wrap {
      position: absolute;
      right: clamp(16px, 2.5vw, 28px);
      bottom: clamp(12px, 2vw, 20px);
      font-size: clamp(11px, 1.4vw, 13px);
      color: rgba(220,224,232,0.6);
      z-index: 10;
    }
    .signature-wrap a { color: #38bdf8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div id="hero-container">
    <video id="hero-video" src="https://cdn.21st.dev/assets/mirror/21/21a77eac28eacbb7e142016eefeaa0b4a766619e51113629a3bc6df6af066c0f.mp4" muted playsinline preload="auto"></video>
    <div class="vignette-overlay"></div>

    <div class="nav-bar">
      <a href="index.html" class="nav-pill">← Back to Master Portal</a>
      <span class="nav-pill">Wheel / Drag to Scrub Video</span>
    </div>

    <div class="center-text-wrap">
      <span id="hero-title">THE CITY OPENS</span>
    </div>

    <div class="center-text-wrap">
      <span id="hero-tagline">Every door in the city is already open.</span>
    </div>

    <div class="scroll-hint" id="scroll-hint">
      <span>Scroll / Swipe</span>
      <svg class="bounce-arrow" width="14" height="18" viewBox="0 0 14 18">
        <path d="M7 1 L7 17 M2 12 L7 17 L12 12" stroke="currentColor" strokeWidth="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="progress-bar-track">
      <div id="progress-bar"></div>
    </div>

    <div class="signature-wrap">
      <span>Project S.E.E.S. • <a href="index.html">ATL TFIC 2026</a></span>
    </div>
  </div>

  <script>
    const video = document.getElementById('hero-video');
    const container = document.getElementById('hero-container');
    const titleEl = document.getElementById('hero-title');
    const taglineEl = document.getElementById('hero-tagline');
    const hintEl = document.getElementById('scroll-hint');
    const progressEl = document.getElementById('progress-bar');

    let duration = 0;
    let targetProgress = 0;
    let currentProgress = 0;
    let isSeeking = false;
    let pendingTime = null;
    let touchStartY = 0;
    const scrubDistance = 3200;

    video.addEventListener('loadeddata', () => {
      duration = video.duration || 0;
      video.style.opacity = '1';
    });

    // Safari / Chrome iOS preload unlock
    const p = video.play();
    if (p && typeof p.then === 'function') {
      p.then(() => video.pause()).catch(() => {});
    } else {
      video.pause();
    }

    video.addEventListener('seeked', () => {
      isSeeking = false;
      if (pendingTime !== null) {
        const t = pendingTime;
        pendingTime = null;
        isSeeking = true;
        video.currentTime = t;
      }
    });

    function seekTo(t) {
      if (isSeeking) {
        pendingTime = t;
        return;
      }
      isSeeking = true;
      video.currentTime = t;
    }

    function addDelta(deltaY) {
      targetProgress = Math.min(1, Math.max(0, targetProgress + deltaY / scrubDistance));
      if (targetProgress > 0.001) hintEl.style.opacity = '0';
    }

    window.addEventListener('wheel', (e) => {
      addDelta(e.deltaY);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0]?.clientY ?? 0;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const y = e.touches[0]?.clientY ?? touchStartY;
      const deltaY = touchStartY - y;
      touchStartY = y;
      addDelta(deltaY);
      e.preventDefault();
    }, { passive: false });

    function frame() {
      currentProgress += (targetProgress - currentProgress) * 0.18;

      if (duration > 0) {
        seekTo(currentProgress * duration);
      }

      const scale = 1 + currentProgress * 0.06;
      video.style.transform = `scale(${scale})`;

      // Title fade and blur
      const t = 1 - Math.min(1, Math.max(0, currentProgress / 0.35));
      titleEl.style.opacity = String(t);
      titleEl.style.transform = `translateY(${(1 - t) * -24}px) scale(${0.96 + t * 0.04})`;
      titleEl.style.filter = `blur(${(1 - t) * 10}px)`;

      // Tagline blur in
      const tTag = Math.min(1, Math.max(0, (currentProgress - 0.82) / 0.18));
      taglineEl.style.opacity = String(tTag);
      taglineEl.style.transform = `translateY(${(1 - tTag) * 20}px) scale(${0.97 + tTag * 0.03})`;
      taglineEl.style.filter = `blur(${(1 - tTag) * 8}px)`;

      // Progress bar
      progressEl.style.transform = `scaleX(${currentProgress})`;

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
